name: Verificar ficha 5e
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  regras-e-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --frozen-lockfile --network-timeout 120000
      - run: yarn check
      - run: yarn test
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --frozen-lockfile --network-timeout 120000
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e
      - name: Guardar relatório e evidências do navegador
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
